---
# Node.js (with bundled npm) comes from the NodeSource repo in the system role.
# Installing Ubuntu's `npm` package here drags in the distro nodejs and apt
# bails out with "held broken packages".

# Everything below installs into the devbox user's ~/.local so the agent never
# needs root to update its own toolchain (issue #16). ~/.local/bin also gets
# created by roles/user_dotfiles, but that runs after us.
- name: Ensure ~/.local/bin exists
  file:
    path: "{{ devbox_user_home }}/.local/bin"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0755'

# In ~/.npmrc rather than NPM_CONFIG_PREFIX so an interactive `npm i -g foo`
# lands in the same place as the playbook's installs.
- name: Point npm's global prefix at ~/.local for the devbox user
  lineinfile:
    path: "{{ devbox_user_home }}/.npmrc"
    regexp: '^prefix='
    line: "prefix={{ devbox_user_home }}/.local"
    create: yes
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0644'

- name: Install global npm AI & Dev CLI tools (claude-code, codex, jules, wrangler, pnpm)
  npm:
    name: "{{ item.key }}"
    version: "{{ item.value if item.value != 'latest' else omit }}"
    global: yes
    state: "{{ 'latest' if item.value == 'latest' else 'present' }}"
  loop: "{{ npm_global_packages | dict2items }}"
  become_user: "{{ devbox_user }}"

- name: Put ~/.local/bin on PATH for every login shell
  copy:
    dest: /etc/profile.d/devbox-path.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by ansible (roles/devtools). The devbox toolchain (npm globals,
      # go binaries, cloudflared, uv) installs per-user into ~/.local/bin.
      # Prepended on purpose: it must win over stale root-installed copies in
      # /usr/bin left behind by earlier provisioning runs.
      if [ -n "${HOME:-}" ] && [ -d "$HOME/.local/bin" ]; then
          case ":$PATH:" in
              *":$HOME/.local/bin:"*) ;;
              *) PATH="$HOME/.local/bin:$PATH"; export PATH ;;
          esac
      fi

# Same deal as NodeSource: astral ships no apt repo, so curl|sh stays. pipefail
# at least stops a half-downloaded installer from being executed.
- name: Install uv (Python package & environment manager)
  shell: |
    set -o pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
  become_user: "{{ devbox_user }}"

- name: Warn that cloudflared will be installed unverified
  debug:
    msg: >-
      cloudflared_sha256 is empty: the binary is downloaded over TLS but its
      contents are not verified. Set cloudflared_sha256 in
      roles/devtools/defaults/main.yml to pin it.
  when: not cloudflared_sha256

# The raw binary, not the .deb: dpkg needs root, a file in ~/.local/bin does
# not. get_url with a checksum is a no-op once the right version is in place.
- name: Install Cloudflare Tunnel CLI (cloudflared)
  get_url:
    url: "https://github.com/cloudflare/cloudflared/releases/{{ ('download/' ~ cloudflared_version) if cloudflared_version != 'latest' else 'latest/download' }}/cloudflared-linux-amd64"
    dest: "{{ devbox_user_home }}/.local/bin/cloudflared"
    checksum: "{{ ('sha256:' ~ cloudflared_sha256) if cloudflared_sha256 else omit }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0755'

- name: "Build and install Go CLI tool: beads (bd)"
  shell: |
    GOBIN={{ devbox_user_home }}/.local/bin go install github.com/steveyegge/beads/cmd/bd@{{ beads_version }}
  become_user: "{{ devbox_user }}"

# Separate task on purpose: as the second line of the shell above, a successful
# ln masked a failed go install and the task reported ok with no binary.
- name: "Symlink beads -> bd"
  file:
    src: "{{ devbox_user_home }}/.local/bin/bd"
    dest: "{{ devbox_user_home }}/.local/bin/beads"
    state: link
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
  become_user: "{{ devbox_user }}"

- name: "Build and install Go CLI tool: ralphex"
  shell: |
    GOBIN={{ devbox_user_home }}/.local/bin go install github.com/umputun/ralphex/cmd/ralphex@{{ ralphex_version }}
  become_user: "{{ devbox_user }}"

# Installs from .../revdiff/app, so `go install` names the binary "app".
- name: "Build and install Go CLI tool: revdiff"
  shell: |
    GOBIN={{ devbox_user_home }}/.local/bin go install github.com/umputun/revdiff/app@{{ revdiff_version }} &&
    mv -f {{ devbox_user_home }}/.local/bin/app {{ devbox_user_home }}/.local/bin/revdiff
  become_user: "{{ devbox_user }}"

# https://antigravity.google/docs/cli/install - the only distribution channel
# (no npm package, no GitHub release); the installer verifies its own sha512.
# It always names the binary "agy", but the YOLO wrapper below owns that name in
# ~/.local/bin, so stage the install in ~/.local/lib and move the real binary to
# agy.bin - which is what the wrapper execs. The installer also appends a PATH
# line for its --dir to the shell profiles; after the move that points at an
# empty dir, so it cannot shadow the wrapper.
# No version knob: the installer only serves latest and the CLI self-updates.
- name: Install Antigravity CLI (agy) as agy.bin
  shell: |
    set -o pipefail
    curl -fsSL https://antigravity.google/cli/install.sh | bash -s -- --dir "{{ devbox_user_home }}/.local/lib/antigravity" &&
    mv -f "{{ devbox_user_home }}/.local/lib/antigravity/agy" "{{ devbox_user_home }}/.local/bin/agy.bin"
  args:
    executable: /bin/bash
    creates: "{{ devbox_user_home }}/.local/bin/agy.bin"
  become_user: "{{ devbox_user }}"

- name: Install update-tools and agy wrapper scripts to ~/.local/bin
  copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0755'
  loop:
    - { src: "{{ playbook_dir }}/../bin/update-tools", dest: "{{ devbox_user_home }}/.local/bin/update-tools" }
    - { src: "{{ playbook_dir }}/../bin/agy", dest: "{{ devbox_user_home }}/.local/bin/agy" }
    - { src: "{{ playbook_dir }}/../bin/kv", dest: "{{ devbox_user_home }}/.local/bin/kv" }

# --- native git against the buzz relay (see README) -------------------------
# apt_repository is deprecated (removal in ansible-core 2.25) but it is the only
# module that still understands the `ppa:` shorthand — deb822_repository wants
# the launchpad URL and signing key spelled out by hand. Swap it when it breaks.
- name: Add the git-core PPA (noble's git 2.43 is too old for NIP-98 auth)
  apt_repository:
    repo: ppa:git-core/ppa
    state: present
  when: git_core_ppa

- name: Upgrade git
  apt:
    name: git
    state: latest
    update_cache: yes
  when: git_core_ppa

- name: Verify git is new enough for the credential authtype capability
  command: git version
  register: git_version
  changed_when: false
  failed_when: git_version.stdout.split()[2] is version('2.46', '<')

# Upstream distributes the helper as a crate only, and a Rust toolchain on the
# box would be a GB of build cruft the devbox never uses again. Docker is
# already here (roles/docker): build in a throwaway container, keep the binary.
# The empty stamp file carries the rev, so `creates` makes every later run free
# but a bumped pin still rebuilds (the binary alone would freeze every box on
# whatever it built first).
- name: Build git-credential-nostr in a throwaway rust container
  shell: |
    set -euo pipefail
    build=$(mktemp -d)
    trap 'rm -rf "$build"' EXIT
    docker run --rm -v "$build:/out" {{ rust_build_image }} \
      cargo install --git https://github.com/block/buzz \
      --rev {{ git_credential_nostr_rev }} --locked --root /out git-credential-nostr
    own="-o {{ devbox_user }} -g {{ devbox_user }}"
    install $own -m 0755 "$build/bin/git-credential-nostr" {{ devbox_user_home }}/.local/bin/
    install $own -d {{ devbox_user_home }}/.local/lib
    install $own -m 0644 /dev/null {{ git_credential_nostr_stamp }}
  args:
    executable: /bin/bash
    creates: "{{ git_credential_nostr_stamp }}"

# useHttpPath is not optional: the helper needs the repo path to build the
# NIP-98 `u` tag, and refuses without it. `git config` is not idempotent by
# itself, hence the read-before-write (community.general.git_config would do
# this, but nothing else in this playbook needs the collection).
# If your yadm dotfiles ship a ~/.gitconfig they win until the next converge,
# which puts these two keys back.
- name: Point the devbox user's git at the nostr credential helper
  become_user: "{{ devbox_user }}"
  shell: |
    set -eu
    out=
    for kv in credential.helper=nostr credential.useHttpPath=true; do
      k=${kv%%=*}; v=${kv#*=}
      [ "$(git config --global --get "$k" || true)" = "$v" ] ||
        { git config --global "$k" "$v"; out=changed; }
    done
    echo "${out:-ok}"
  register: git_relay_config
  changed_when: git_relay_config.stdout == 'changed'
