---
- name: Fail early on missing agent credentials
  assert:
    that:
      - claude_code_oauth_token | length > 0
      - buzz_relay_owner_pubkey | length > 0 or buzz_agent_respond_to in ['anyone', 'nobody']
    fail_msg: >-
      buzz_agent needs claude_code_oauth_token (from `claude setup-token`), and
      buzz_relay_owner_pubkey unless buzz_agent_respond_to is anyone/nobody —
      buzz-acp's owner-only gate drops every event while the owner is unknown.
    quiet: yes

# The agent connects with the public hostname (community routing is Host-based)
# but should never depend on external DNS or hairpin NAT: pin the name to
# loopback, where Caddy terminates TLS and proxies to the relay.
- name: Pin {{ buzz_host }} to loopback for the on-box agent
  lineinfile:
    path: /etc/hosts
    line: "127.0.0.1 {{ buzz_host }}"
    regexp: '\s{{ buzz_host | regex_escape }}$'

- name: Create the shared workspace and lib directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0755'
  loop:
    - "{{ buzz_agent_workspace }}"
    - "{{ devbox_user_home }}/.local/lib/sprig"

# sprig is a multicall binary: one static musl ELF that becomes buzz-acp, the
# `buzz` CLI, etc. depending on argv[0]. The .sha256 asset is fetched by
# get_url and enforced on every run, which is what keeps the rolling
# `sprig-latest` release honest.
- name: Download the sprig release tarball (buzz-acp + buzz CLI)
  get_url:
    url: "https://github.com/block/buzz/releases/download/{{ buzz_agent_sprig_release }}/{{ buzz_agent_sprig_asset }}"
    dest: "{{ devbox_user_home }}/.local/lib/sprig/{{ buzz_agent_sprig_asset }}"
    checksum: "sha256:https://github.com/block/buzz/releases/download/{{ buzz_agent_sprig_release }}/{{ buzz_agent_sprig_asset }}.sha256"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0644'
  register: sprig_tarball

- name: Check whether sprig is already unpacked
  stat:
    path: "{{ devbox_user_home }}/.local/lib/sprig/sprig"
  register: sprig_binary

# Also unpacks when the binary is missing but the tarball is current — an
# interrupted run would otherwise leave dangling symlinks and a dead service.
- name: Unpack sprig
  unarchive:
    src: "{{ devbox_user_home }}/.local/lib/sprig/{{ buzz_agent_sprig_asset }}"
    dest: "{{ devbox_user_home }}/.local/lib/sprig"
    remote_src: yes
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
  when: sprig_tarball.changed or not sprig_binary.stat.exists
  notify: Restart buzz agents

# ~/.local/bin is on PATH for login shells (roles/devtools). `buzz` has to be
# there too: the base prompt tells the agent to reply with the buzz CLI.
- name: Expose the sprig personalities the agents need on PATH
  file:
    src: "{{ devbox_user_home }}/.local/lib/sprig/sprig"
    dest: "{{ devbox_user_home }}/.local/bin/{{ item }}"
    state: link
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
  loop:
    - buzz-acp
    - buzz
  notify: Restart buzz agents

# codex-acp shells out to the Codex CLI (installed by roles/devtools), which
# reads ~/.codex/auth.json — there is no env-var path for a ChatGPT login.
# force: no because codex refreshes the access token in this file on the box;
# re-pushing the stashed copy would roll it back to an expired one.
- name: Create the Codex CLI state directory
  file:
    path: "{{ devbox_user_home }}/.codex"
    state: directory
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0700'
  when: codex_auth_json | length > 0

- name: Install the Codex CLI credential
  copy:
    content: "{{ codex_auth_json }}"
    dest: "{{ devbox_user_home }}/.codex/auth.json"
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: '0600'
    force: no
  no_log: yes
  when: codex_auth_json | length > 0

# --- relay admission plumbing --------------------------------------------
# buzz-admin (keygen and membership) ships inside the relay image
# (/usr/local/bin/buzz-admin) and needs the relay's DATABASE_URL, REDIS_URL and
# BUZZ_RELAY_PRIVATE_KEY — so it is run inside the relay container, exactly as
# upstream's deploy/compose/run.sh does.
- name: Locate the running relay container
  command: >-
    docker ps -q
    --filter label=com.docker.compose.project={{ buzz_compose_project }}
    --filter label=com.docker.compose.service={{ buzz_relay_compose_service }}
  register: relay_container
  changed_when: false

- name: Require the relay to be up
  assert:
    that: relay_container.stdout | length > 0
    fail_msg: >-
      No running relay container for compose project
      '{{ buzz_compose_project }}' service '{{ buzz_relay_compose_service }}'.
      The buzz stack must be up before this role: buzz-admin (keygen and
      membership) only exists inside the relay image.
    quiet: yes

# --- one unit for all agents ---------------------------------------------
- name: Install the buzz-agent@ systemd template unit
  template:
    src: buzz-agent@.service.j2
    dest: /etc/systemd/system/buzz-agent@.service
    owner: root
    group: root
    mode: '0644'
  notify: Restart buzz agents

# --- migration: single-agent layout -> per-agent -------------------------
# Boxes provisioned before this role grew a `buzz_agents` list keep the claude
# agent's keypair in ~/.config/buzz-agent behind a plain buzz-agent.service.
# Move it, never regenerate it: the pubkey is already in channel member lists,
# profiles and DMs. MUST run before the per-agent tasks, or the loop would see
# an empty config dir and mint a new identity.
- name: Check for the pre-multi-agent layout
  stat:
    path: "{{ devbox_user_home }}/.config/buzz-agent"
  register: legacy_agent_dir

- name: Migrate the single-agent layout to the per-agent one
  when: legacy_agent_dir.stat.isdir | default(false)
  block:
    - name: Stop and disable the legacy buzz-agent unit
      systemd:
        name: buzz-agent
        state: stopped
        enabled: no

    - name: Remove the legacy buzz-agent unit file
      file:
        path: /etc/systemd/system/buzz-agent.service
        state: absent

    - name: Move the claude agent's identity to its per-agent directory
      command: >-
        mv {{ devbox_user_home }}/.config/buzz-agent
           {{ devbox_user_home }}/.config/buzz-agent-claude
      args:
        creates: "{{ devbox_user_home }}/.config/buzz-agent-claude"

- name: Configure each agent
  include_tasks: agent.yml
  loop: "{{ buzz_agents }}"
  loop_control:
    loop_var: agent
    label: "{{ agent.name }}"
