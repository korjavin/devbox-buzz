---
# Handlers cannot see the per-agent loop var, so anything that changes for one
# agent restarts them all. Restarts are cheap here (the harness reconnects) and
# a converge with nothing changed fires no handler at all.
- name: Restart buzz agents
  systemd:
    name: "buzz-agent@{{ item.name }}"
    state: restarted
    daemon_reload: yes
  loop: "{{ buzz_agents }}"
  loop_control:
    label: "{{ item.name }}"

- name: Restart buzz agent loggers
  systemd:
    name: "buzz-agent-logger@{{ item.name }}"
    state: restarted
    daemon_reload: yes
  loop: "{{ buzz_agents }}"
  loop_control:
    label: "{{ item.name }}"
  when: buzz_relay_owner_pubkey | length > 0
