---
# Coding agents attached to the local buzz relay through the buzz-acp harness.
# See README.md in this role for the moving parts and the relay-admission flow.

# --- the agents ----------------------------------------------------------
# One buzz-agent@<name> unit, one keypair, one ~/.config/buzz-agent-<name> per
# entry. `name` is also the kind:0 display name, so keep it short and stable —
# renaming an agent orphans its keypair (and its relay membership) under the
# old directory.
buzz_agents:
  - name: claude
    adapter_npm: "@agentclientprotocol/claude-agent-acp"
    adapter_command: claude-agent-acp
    about: "Claude Code agent on this box (buzz-acp host runner). @mention me with a task."
  - name: codex
    adapter_npm: "@agentclientprotocol/codex-acp"
    adapter_command: codex-acp
    about: "OpenAI Codex agent on this box (buzz-acp host runner). @mention me with a task."

# --- required, no sane default -------------------------------------------
# Claude Code OAuth token (`claude setup-token`). There is no ANTHROPIC_API_KEY
# in this deployment; claude-agent-acp runs on the Claude Agent SDK, which
# treats CLAUDE_CODE_OAUTH_TOKEN as a first-class credential. Lands ONLY in the
# 0600 EnvironmentFile. Pass with -e or a vault.
claude_code_oauth_token: ""

# Contents of the Codex CLI credential (`~/.codex/auth.json` from a machine
# where you ran `codex login`). Written once, never overwritten: codex rotates
# the ChatGPT tokens in place on the box, and re-pushing the stashed copy would
# roll them back. Empty = no codex credential is installed.
codex_auth_json: ""

# The relay owner's Nostr pubkey (64-char hex) — same key as RELAY_OWNER_PUBKEY
# in the relay stack. buzz-acp's default author gate is `owner-only`, and an
# agent with no owner answers nobody, so this is required unless you move
# buzz_agent_respond_to off owner-only. Defaults to the relay role's own var so
# the two stay in step without the playbook repeating itself.
buzz_relay_owner_pubkey: "{{ buzz_owner_pubkey | default('') }}"

# NIP-OA owner attestations, per agent name: {claude: '["auth",...]', ...}.
# The desktop derives "managed by <owner>" from a valid `auth` tag on the
# agent's kind:0 — and that tag can only be signed by the OWNER's secret key,
# which never touches this box. So it is minted on the owner's machine and
# passed in here; without it the app shows "owner unavailable". See the role
# README for the one-shot command. Empty = no attestation, agents still work.
buzz_agent_auth_tags: {}

# --- debug log channels --------------------------------------------------
# Each agent's journal is forwarded into a private channel `debug-<name>` that
# the owner owns. The forwarder posts as its own identity (below), not as the
# agent: the channel is a log sink, and the agents are deliberately not in it.
buzz_agent_logger_dir: "{{ devbox_user_home }}/.config/buzz-logs"
# Batch window — a batch is flushed after this many seconds or lines,
# whichever comes first. Tune for chattiness vs. how live the channel feels.
buzz_agent_log_flush_seconds: 15
buzz_agent_log_max_lines: 40

# --- relay ---------------------------------------------------------------
# Loopback: the relay publishes its HTTP port on 127.0.0.1, so no TLS hop
# on-box. ws:// is right for both consumers — buzz-acp speaks the websocket,
# and the `buzz` CLI rewrites ws->http internally (buzz-cli/src/client.rs).
# The relay resolves its community from the Host header (derived from the
# relay's own BUZZ_RELAY_URL, port-sensitive), so the agent must connect with
# the public hostname — a loopback URL 404s. An /etc/hosts entry (tasks) keeps
# the connection on-box; the cert must be production LE (rustls webpki roots).
buzz_relay_url: "wss://{{ buzz_host }}"

# How the relay container is found for the buzz-admin calls (keygen +
# add-member). Compose labels rather than a container name: upstream's bundle
# sets `name: buzz-prod` and no container_name, so the name is generated.
buzz_compose_project: "buzz-prod"
buzz_relay_compose_service: "relay"

# --- sprig (ships buzz-acp + the buzz CLI) -------------------------------
# buzz-acp has no crates.io/npm/apt distribution and is not in the relay image.
# Upstream ships it in the `sprig` multicall binary: one static musl ELF whose
# personality is chosen by argv[0] (buzz-acp, buzz-agent, buzz-dev-mcp, buzz).
# `sprig-latest` is a rolling release tracking main; pin it to a `sprig-v*` tag
# for reproducibility. Integrity comes from the sibling .sha256 asset, which
# get_url fetches and enforces on every run.
buzz_agent_sprig_release: "sprig-latest"
buzz_agent_sprig_asset: "sprig-x86_64-unknown-linux-musl.tar.gz"

# --- harness behaviour ---------------------------------------------------
# owner-only | allowlist | anyone | nobody
buzz_agent_respond_to: "owner-only"
# Extra pubkeys (comma-separated 64-char hex) for allowlist mode. Owner is
# always implicitly included.
buzz_agent_respond_to_allowlist: ""
# Relay role for the agent's pubkey: member or admin (owner is not settable).
buzz_agent_relay_role: "member"
# Publish encrypted ACP observer frames (NIP-AO) so the owner can watch the
# agent's live internals from the desktop. Off upstream; on here, because
# that is the whole point of a box you own. Set false to stop the stream.
buzz_agent_relay_observer: true

# Where the agents do their work — their cwd, and what they can see. Shared on
# purpose: they are teammates on one box, not tenants.
buzz_agent_workspace: "{{ devbox_user_home }}/buzz-workspace"
