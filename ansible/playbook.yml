---
- name: Provision Buzzbox Devbox Server
  hosts: devbox
  become: yes
  vars:
    # Consumed by the system (creates it), docker, devtools and user_dotfiles
    # roles. Override with -e devbox_user=yourname.
    devbox_user: "devbox"
    devbox_user_home: "/home/{{ devbox_user }}"
    # Caddy uses it for ACME/TLS in the buzz role.
    acme_email: "admin@example.com"

  roles:
    - role: system
    - role: docker
    - role: devtools
    - role: user_dotfiles
    - role: buzz
      when: buzz_host | default('') | length > 0
    - role: buzz_agent
      when: buzz_agent_enabled | default(buzz_host is defined and buzz_host | length > 0)
