# Vendored from block/buzz deploy/compose/compose.caddy.yml
# @ 0571f5455b1b2aeea7334082f0df9d1f19b22f7d, with two local adaptations
# (marked "devbox:" below). Needs Docker Compose v2.24.4+ for the !override tag.
services:
  relay:
    # devbox: upstream is `ports: !reset []` -- it drops the relay publish entirely
    # so only Caddy is reachable. We keep a loopback-only publish instead, because
    # a host-side agent process (outside Docker) connects to ws://127.0.0.1:<port>.
    # !override replaces the base list rather than appending to it, so the public
    # 0.0.0.0 publish from compose.yml is still gone.
    ports: !override
      - "127.0.0.1:${BUZZ_HTTP_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      BUZZ_DOMAIN: ${BUZZ_DOMAIN:?set BUZZ_DOMAIN}
      # devbox: ACME registration address, consumed by the Caddyfile global block.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - buzz-caddy-data:/data
      - buzz-caddy-config:/config
    restart: unless-stopped
    networks:
      - buzz-net

volumes:
  buzz-caddy-data:
    labels:
      com.buzz.volume: caddy-data
  buzz-caddy-config:
    labels:
      com.buzz.volume: caddy-config
